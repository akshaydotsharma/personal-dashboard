name: PersonalDashboard
options:
  bundleIdPrefix: com.akshaysharma
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

targets:
  PersonalDashboard:
    type: application
    platform: iOS
    sources:
      - path: PersonalDashboard
        excludes:
          - "Resources/Preview Content/**"
          - "Resources/Fonts/**"
          - "App/DexterMacApp.swift"   # macOS @main; belongs only to DexterMac target
          - "InfoMac.plist"            # generated Info.plist for the macOS target
      - path: PersonalDashboard/Resources/Preview Content
        type: folder
      - path: PersonalDashboard/Resources/Fonts
        buildPhase: resources
      - path: PersonalDashboard/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: PersonalDashboard/Info.plist
      properties:
        CFBundleDisplayName: Dexter
        # Versioning scheme: "a.b.c (d)" — see mobile/ota/ship-lan.sh for the
        # derivation. a.b come from mobile/VERSION; c is auto-derived from
        # git history (commits since VERSION last changed); d is a local
        # build counter at mobile/.build_count.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        OTA_API_URL: $(OTA_API_URL)
        ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
        # OpenAI key for cloud voice transcription (#151). Injected at
        # archive time by ship-lan.sh; empty for plain Xcode builds.
        OPENAI_API_KEY: $(OPENAI_API_KEY)
        # Allow plain-HTTP calls to the Mac dev server on the local network.
        # Personal-use dev build only — App Store distribution is not a goal.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # Triggers the iOS local-network permission prompt the first time
        # the App Intent or main app reaches a LAN IP.
        NSLocalNetworkUsageDescription: "Dexter talks to your Mac dev server over wifi when you're on the same network."
        # Bonjour service types our launch primer browses for. Required
        # alongside NSLocalNetworkUsageDescription, otherwise the browse
        # silently fails and the prompt never appears.
        NSBonjourServices:
          - _http._tcp
        # Deep-link scheme used by the Shortcut capture result snippet
        # ("Open in Dexter" button) and any future external entry points.
        # Routes are parsed in ContentView.onOpenURL:
        #   dexter://focus/<section>/<uuid>  — open a section and focus a row
        #   dexter://activity                — open the Activity timeline
        CFBundleURLTypes:
          - CFBundleURLName: com.akshaysharma.personaldashboard.deeplink
            CFBundleURLSchemes:
              - dexter
        # Voice input in chat (issues #83, #151). Primary path uploads a
        # short recording to OpenAI for transcription (auto-detects Hindi /
        # English / Hinglish). Speech key is still required for the on-device
        # English fallback used when no OpenAI key is configured.
        NSSpeechRecognitionUsageDescription: "Dexter transcribes your voice into chat messages. With no transcription key set it falls back to on-device English recognition."
        NSMicrophoneUsageDescription: "Dexter records your voice so it can transcribe what you say into the chat."
        # Receipt capture for Finance (issue #114, Phase B). Camera + photo
        # library access used by AddExpense flow to extract details via Vision.
        NSCameraUsageDescription: "Used to capture receipts so Dexter can log expenses for you."
        NSPhotoLibraryUsageDescription: "Used to import a receipt photo when logging an expense."
        # Email-to-itinerary ingestion (#143). `fetch` lets the
        # BGAppRefreshTask wake the app to poll the receipts inbox over IMAP;
        # `processing` covers the longer on-device AI matching pass. The
        # scheduler identifier must match EmailIngestCoordinator.refreshTaskId.
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.akshaysharma.personaldashboard.emailIngestRefresh
          # Recurring-expense materialisation (#236). Must match
          # RecurringExpenseCoordinator.refreshTaskId. Best-effort background
          # top-up; the foreground pass is the reliable path.
          - com.akshaysharma.personaldashboard.recurringExpenseRefresh
        UIAppFonts:
          - Calistoga-Regular.ttf
          - Inter-Regular.ttf
          - Inter-Medium.ttf
          - Inter-SemiBold.ttf
          - JetBrainsMono-Regular.ttf
    # NO entitlements file here on purpose. Time-Sensitive Notifications was tried
    # for #444 (it is the only way to break a reminder through a Focus mode or a
    # Scheduled Summary) and free personal-team signing REJECTS it, exactly like
    # App Groups and CloudKit:
    #
    #   error: Provisioning profile "iOS Team Provisioning Profile:
    #   com.akshaysharma.personaldashboard" doesn't include the Time Sensitive
    #   Notifications capability.
    #
    # Don't re-add it without the paid Apple Developer Program. Setting
    # `interruptionLevel = .timeSensitive` in code without the entitlement is inert,
    # so that is deliberately not done either.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshaysharma.personaldashboard
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_ASSET_PATHS: '"PersonalDashboard/Resources/Preview Content"'
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: "PJFPUSSNUW"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Default version values — overridden by ship-lan.sh on every ship.
        # Local Xcode-only builds (Cmd+R) inherit these as-is.
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"

  # Native macOS app (issue #281). Shares the portable model/design/service
  # layer with the iOS target via an explicit curated source list — only files
  # that compile on macOS (UIKit shimmed behind `#if canImport(UIKit)`) are
  # included. The first feature is Tasks; the list grows as surfaces are ported.
  DexterMac:
    type: application
    platform: macOS
    sources:
      - path: PersonalDashboard/Models
      - path: PersonalDashboard/Cache/SwiftDataStore.swift
      # Refuses to open a store holding entities this build does not know (#449).
      - path: PersonalDashboard/Cache/StoreSchemaGuard.swift
      - path: PersonalDashboard/Cache/StoreChange.swift
      - path: PersonalDashboard/Design
      - path: PersonalDashboard/App/AppRouter.swift
      - path: PersonalDashboard/App/DexterMacApp.swift
      - path: PersonalDashboard/App/MacCommands.swift
      - path: PersonalDashboard/ViewModels/TodosViewModel.swift
      - path: PersonalDashboard/Services/TodoService.swift
      # Task reminders (#444). The scheduler is shared with iOS; the presenter is
      # macOS-only and exists because iOS's notification delegate
      # (EmailIngestCoordinator) is built on UIKit/BackgroundTasks and stays out
      # of this target, which left the Mac with no delegate at all.
      - path: PersonalDashboard/Services/TaskReminderScheduler.swift
      - path: PersonalDashboard/Services/MacNotificationPresenter.swift
      - path: PersonalDashboard/Services/MapsLinkResolver.swift
      # .pkpass ingest (#420): a zip reader and the pass.json mapper. Shared
      # with iOS; the Apple Wallet hand-off around them is iOS-only and stays
      # out of this target.
      - path: PersonalDashboard/Services/ZipArchiveReader.swift
      - path: PersonalDashboard/Services/WalletPassImport.swift
      - path: PersonalDashboard/Services/APIError.swift
      - path: PersonalDashboard/ViewModels/NotesViewModel.swift
      - path: PersonalDashboard/ViewModels/ListsViewModel.swift
      - path: PersonalDashboard/Services/NoteService.swift
      # Note image attachments (#395).
      - path: PersonalDashboard/Services/NoteImageService.swift
      - path: PersonalDashboard/Views/Notes/NoteImageViewer.swift
      - path: PersonalDashboard/Views/Components/NoteBodyMarkdown.swift
      - path: PersonalDashboard/Views/Components/PinchZoomImageView.swift
      - path: PersonalDashboard/Services/ChecklistService.swift
      - path: PersonalDashboard/Services/FinanceSettings.swift
      - path: PersonalDashboard/Views/Tasks
      # Vision board (#446). Whole folder, like Views/Tasks above: every file in
      # it belongs to this surface and none of them is iOS-only. The @Model, the
      # DTO and the state enum need no entry — PersonalDashboard/Models is
      # globbed at the top of this list.
      - path: PersonalDashboard/Views/VisionBoard
      - path: PersonalDashboard/ViewModels/VisionBoardViewModel.swift
      - path: PersonalDashboard/ViewModels/VisionItemEditor.swift
      - path: PersonalDashboard/Services/VisionBoardService.swift
      - path: PersonalDashboard/Views/Lists/ListsView.swift
      - path: PersonalDashboard/Views/Today/TodayView.swift
      - path: PersonalDashboard/Views/Notes/NoteAutosave.swift
      - path: PersonalDashboard/Views/Notes/NotesView.swift
      - path: PersonalDashboard/Views/Components/MarkdownEditor.swift
      - path: PersonalDashboard/Views/Activity/ActivityView.swift
      - path: PersonalDashboard/Views/Finance/FinanceDashboardBand.swift
      # Expanded Finance dashboard: breakdown model + panel (issue #389).
      - path: PersonalDashboard/Views/Finance/FinanceInsights.swift
      - path: PersonalDashboard/Views/Finance/FinanceInsightsPanel.swift
      - path: PersonalDashboard/Views/Settings/PersonalVocabularyView.swift
      - path: PersonalDashboard/Views/Components/GhostAddRow.swift
      - path: PersonalDashboard/Views/Components/MacAddRow.swift
      - path: PersonalDashboard/Views/Components/DeleteRowButton.swift
      - path: PersonalDashboard/Views/Components/SectionEyebrow.swift
      - path: PersonalDashboard/Views/Components/MarkdownView.swift
      - path: PersonalDashboard/Views/Components/MarkdownTable.swift
      - path: PersonalDashboard/Views/Components/MarkdownListSyntax.swift
      - path: PersonalDashboard/Views/Shell/TopBar.swift
      - path: PersonalDashboard/Views/Shell/BottomTabBarMetrics.swift
      - path: PersonalDashboard/Views/Shell/MacMenuButton.swift
      # Chat (issue #281). Text chat only — the voice capture path
      # (VoiceCaptureViewModel / SpeechTranscriber / overlay / VoiceWaveform /
      # VoiceAurora / WaveformBars) is AVFoundation/Speech-coupled, gated with
      # `#if os(iOS)` inside ChatView, so those files stay out of this target.
      - path: PersonalDashboard/App/AppConfig.swift
      # User-supplied API key, Keychain-backed (#337). The scheme's env var is
      # written by `xcodegen generate` from the shell, so a regenerate without
      # the export unconfigures Chat; this is the source that survives it.
      - path: PersonalDashboard/Services/KeychainStore.swift
      - path: PersonalDashboard/Services/UserAPIKeys.swift
      - path: PersonalDashboard/Views/Chat/ChatView.swift
      - path: PersonalDashboard/Views/Chat/ChatInputBar.swift
      - path: PersonalDashboard/Views/Chat/ChatComponents.swift
      - path: PersonalDashboard/Views/Chat/ChatResultCard.swift
      - path: PersonalDashboard/ViewModels/ChatViewModel.swift
      - path: PersonalDashboard/AI/ChatStream.swift
      - path: PersonalDashboard/AI/AnthropicClient.swift
      - path: PersonalDashboard/AI/AssistantContextBuilder.swift
      - path: PersonalDashboard/AI/ChatDraft.swift
      - path: PersonalDashboard/AI/ChatActionResult.swift
      - path: PersonalDashboard/AI/ToolDefinitions.swift
      - path: PersonalDashboard/AI/ExecuteDraftAction.swift
      - path: PersonalDashboard/Services/AIStreamingService.swift
      - path: PersonalDashboard/Services/FXService.swift
      - path: PersonalDashboard/Services/ExpenseService.swift
      - path: PersonalDashboard/Services/ImportJobCenter.swift
      - path: PersonalDashboard/Services/PersonService.swift
      - path: PersonalDashboard/Services/EventService.swift
      - path: PersonalDashboard/Services/RecurringExpenseService.swift
      - path: PersonalDashboard/Services/RecurringExpenseNotifications.swift
      # Settings (issue #281). The email-inbox surface (EmailInboxView) and its
      # BackgroundTasks/IMAP ingest stack (EmailIngestService, IMAPClient,
      # EmailIngestCoordinator) stay OUT of this target — iOS-only. The email
      # LOG model + outcome enum live in Models/ (already in target) so the
      # parsed-files history compiles; it just shows zero email rows on macOS.
      - path: PersonalDashboard/App/ColorSchemePref.swift
      - path: PersonalDashboard/Views/Settings/SettingsView.swift
      - path: PersonalDashboard/Views/Settings/ResetDataView.swift
      - path: PersonalDashboard/Views/Settings/BackupSettingsView.swift
      - path: PersonalDashboard/Views/Settings/ParsedFilesView.swift
      - path: PersonalDashboard/Views/Settings/DataExportImportView.swift
      - path: PersonalDashboard/Services/BackupService.swift
      - path: PersonalDashboard/Services/BackupSettings.swift
      - path: PersonalDashboard/Services/DataExportService.swift
      - path: PersonalDashboard/Services/DataImportService.swift
      - path: PersonalDashboard/Services/ReceiptStorage.swift
      - path: PersonalDashboard/Services/MiniZip.swift
      - path: PersonalDashboard/Services/DataArchive.swift
      # Apple Notes import (#396). macOS only — no iOS read API exists.
      - path: PersonalDashboard/Services/AppleNotesReader.swift
      - path: PersonalDashboard/Services/AppleNotesHTMLConverter.swift
      - path: PersonalDashboard/Services/AppleNotesImportService.swift
      - path: PersonalDashboard/Views/Settings/AppleNotesImportView.swift
      # Cross-device sync (issue #348). Both targets need the whole stack: the
      # Mac is one of the two peers, so omitting any of it would make the feature
      # single-ended.
      #
      # Models/Local/SyncModels.swift is NOT listed here on purpose — this target
      # already globs `PersonalDashboard/Models` (above), so listing it again is a
      # duplicate source and xcodegen rejects it. The four sidecar @Models it
      # carries are therefore already in both targets, which they must be or the
      # two schemas diverge.
      - path: PersonalDashboard/Sync/SyncOp.swift
      - path: PersonalDashboard/Sync/SyncAssets.swift
      - path: PersonalDashboard/Sync/SyncAssetRepair.swift
      - path: PersonalDashboard/Sync/SyncFolder.swift
      - path: PersonalDashboard/Sync/SyncRecordMapper.swift
      - path: PersonalDashboard/Sync/SyncApplier.swift
      - path: PersonalDashboard/Sync/SyncEngine.swift
      - path: PersonalDashboard/Sync/SyncCoordinator.swift
      - path: PersonalDashboard/Sync/SyncRefresh.swift
      - path: PersonalDashboard/Views/Settings/SyncStatusView.swift
      - path: PersonalDashboard/Views/Finance/ExpenseRow.swift
      # People / trips lookup hoisted out of ExpenseRow, and the shared cached
      # number/date formatters every Finance surface now uses (issue #442).
      - path: PersonalDashboard/Views/Finance/ExpenseRowLookup.swift
      - path: PersonalDashboard/Views/Finance/FinanceFormatters.swift
      - path: PersonalDashboard/Views/Finance/PersonEventBadge.swift
      # Payer / sharer letter avatars on a trip expense row (#508).
      - path: PersonalDashboard/Views/Finance/SplitAvatarCluster.swift
      # Finance surface (issue #281). The camera capture path
      # (CameraPicker.swift, UIImagePickerController) is iOS-only and stays OUT
      # of this target; FinanceView gates its menu item + fullScreenCover with
      # `#if os(iOS)`. Photo-library (PhotosUI), PDF + statement import
      # (.fileImporter), manual entry, and recurring expenses all work on
      # macOS. Receipt viewers in AddExpenseSheet are AppKit variants behind
      # `#if os(iOS)/#else`. BarcodeService / APIClient are NOT pulled by the
      # Finance chain (Trips-only) so they stay out.
      - path: PersonalDashboard/Views/Finance/FinanceView.swift
      - path: PersonalDashboard/Views/Finance/AddExpenseSheet.swift
      - path: PersonalDashboard/Views/Finance/FinanceFilterBar.swift
      - path: PersonalDashboard/Views/Finance/FinanceProcessingRow.swift
      - path: PersonalDashboard/Views/Finance/PrefilledExpense.swift
      - path: PersonalDashboard/Views/Finance/PhotoLibraryPicker.swift
      - path: PersonalDashboard/Views/Finance/PDFPicker.swift
      - path: PersonalDashboard/Views/Finance/RecurringExpensesView.swift
      - path: PersonalDashboard/Views/Finance/RecurringExpenseEditorSheet.swift
      - path: PersonalDashboard/AI/StatementImporter.swift
      - path: PersonalDashboard/AI/ExpenseDedupe.swift
      - path: PersonalDashboard/AI/AnthropicClient+ExtractExpense.swift
      - path: PersonalDashboard/AI/AnthropicClient+ExtractStatement.swift
      - path: PersonalDashboard/AI/PDFChunker.swift
      # Trips / itineraries surface (issue #281 — final feature). The
      # present-to-scan surface (TicketScanView.swift: UIScreen.brightness +
      # idle timer + camera) is iOS-only and stays OUT of this target; its call
      # sites are `#if os(iOS)`-guarded and the stay-detail cover falls back to a
      # `.sheet` on macOS. The reachable viewers (TicketOriginalViewer /
      # TicketAttachmentThumbnail) were relocated to the cross-platform
      # TicketViewers.swift. TicketStorage / BarcodeService / TicketExtraction
      # are shimmed cross-platform (UIKit `#if`, ImageIO/CoreGraphics on macOS).
      # BCBPParser + AddressGeocoder are already portable Foundation/CoreLocation.
      - path: PersonalDashboard/Services/BCBPParser.swift
      - path: PersonalDashboard/Services/AddressGeocoder.swift
      - path: PersonalDashboard/Services/TicketStorage.swift
      - path: PersonalDashboard/Services/BarcodeService.swift
      - path: PersonalDashboard/AI/TicketExtraction.swift
      # Pulled in by TicketExtraction since #475: an uploaded ticket is stamped
      # with the same segment-precise dedupe signature the email path writes, so
      # a later forwarded email cannot duplicate a leg. Portable
      # Foundation/SwiftData, no UIKit.
      - path: PersonalDashboard/AI/EmailItemDedupe.swift
      - path: PersonalDashboard/Views/Trips/TripsView.swift
      - path: PersonalDashboard/Views/Trips/TripDetailView.swift
      - path: PersonalDashboard/Views/Trips/TripExpensesView.swift
      - path: PersonalDashboard/Views/Trips/TripCalendarPopover.swift
      - path: PersonalDashboard/Views/Trips/TicketCardView.swift
      - path: PersonalDashboard/Views/Trips/TicketViewers.swift
      # Trip cover illustration (issue #428). Fully portable: the generator is
      # Foundation + URLSession against the OpenAI images API, the silhouette crop is
      # pure ImageIO + CoreGraphics with no UIKit/AppKit, the on-disk cache is the
      # already-shimmed ReceiptStorage, and the band renders through
      # `Image(platformImage:)`. `TripCoverMetrics` and `Tokens.coverSeamVeil` live
      # under Design/, which this target globs, so they need no entry.
      - path: PersonalDashboard/Services/TripCoverProvider.swift
      - path: PersonalDashboard/Services/TripCoverCrop.swift
      - path: PersonalDashboard/Services/TripCoverService.swift
      - path: PersonalDashboard/Views/Trips/TripCoverBand.swift
      # #428 wires the launch repair sweep through AppMaintenance, so the Mac
      # target needs it compiled. Its other two passes (#309's backup and
      # recurring-expense materialisation) are still unwired on both platforms and
      # stay that way — only `runTripCoverSweep()` is called.
      - path: PersonalDashboard/Services/AppMaintenance.swift
      # Task ticket cards (issue #399). The card, detail sheet and editor section
      # live under Views/Tasks, which is globbed above, so only these two need
      # listing. Both are portable: the service is Foundation + SwiftData, and the
      # extractor reuses the already-shimmed TicketStorage / BarcodeService. The
      # brightness-boosted scan surface is iOS-only and stays out, exactly as
      # TicketScanView.swift does.
      - path: PersonalDashboard/Services/TaskTicketService.swift
      - path: PersonalDashboard/AI/TaskTicketExtraction.swift
      # Wallet surface (issue #398). Present-to-scan (TicketScanView) stays iOS-
      # only for the same brightness / idle-timer reason as the trip path, so the
      # wallet's tap routes every card to the detail sheet on macOS and its
      # `TicketScanView` call sites are `#if os(iOS)`-guarded. Camera capture is
      # likewise iOS-only; Photos + PDF import work on both. The models
      # (LocalWalletCard, WalletEntry, TicketCardData, WallClock) are picked up by
      # the `PersonalDashboard/Models` glob above and need no entry here.
      - path: PersonalDashboard/Views/Wallet/WalletView.swift
      - path: PersonalDashboard/Views/Wallet/WalletDeckCard.swift
      - path: PersonalDashboard/Views/Wallet/WalletTicketCard.swift
      - path: PersonalDashboard/Views/Wallet/TicketCardBack.swift
      - path: PersonalDashboard/Views/Wallet/StayLocationStub.swift
      - path: PersonalDashboard/Views/Wallet/WalletCardDetailSheet.swift
      - path: PersonalDashboard/Views/Wallet/WalletCardEditorSheet.swift
      - path: PersonalDashboard/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: PersonalDashboard/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: PersonalDashboard/InfoMac.plist
      properties:
        CFBundleDisplayName: Dexter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "14.0"
        ITSAppUsesNonExemptEncryption: false
        # Anthropic Messages API key for on-device Chat (issue #281). Mirrors
        # the iOS target: an explicit `xcodebuild ANTHROPIC_API_KEY=…` fills
        # this build setting. When it is empty, the post-build script below
        # fills it from server/.env (#343), so a plain Xcode build is
        # configured without anyone exporting anything.
        ANTHROPIC_API_KEY: $(ANTHROPIC_API_KEY)
        # OpenAI key, filled by the same post-build script (#439). The Mac needs
        # it for trip cover illustrations: art is generated per device because
        # sync carries `coverImagePath` but never the JPEG, so a peer holding the
        # row and not the file regenerates from the destination name. Without a
        # key that call throws `.notConfigured`, which `TripCoverService` treats
        # as permanent, and every tile falls back to the glyph.
        OPENAI_API_KEY: $(OPENAI_API_KEY)
        # Custom fonts ship as a Fonts/ folder reference; register them for
        # AppKit/SwiftUI. `.custom()` falls back to system font if this fails.
        ATSApplicationFontsPath: Fonts
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshaysharma.personaldashboard.mac
        DEVELOPMENT_TEAM: "PJFPUSSNUW"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        ENABLE_PREVIEWS: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Dev-only build run from Xcode. Sandbox off keeps file access simple
        # for the later iCloud-backup-restore milestone; revisit before any
        # signed distribution.
        ENABLE_APP_SANDBOX: NO
    # Fill the API keys from server/.env at build time (#343, extended by #439).
    #
    # iOS gets its keys from that same file via ship-lan.sh at archive time.
    # macOS has no ship script — it runs straight out of Xcode — so before this
    # the only build-time path was the scheme's env var, which xcodegen expands
    # FROM THE SHELL at generate time. Regenerating without the export wrote a
    # literal `${ANTHROPIC_API_KEY}` into the scheme and Chat went dead. This
    # runs on every build and reads the key at BUILD time, so it cannot be
    # invalidated by regenerating the project.
    #
    # Post-build, not pre-build: "Process Info.plist" runs late, so a pre-build
    # write would be overwritten. Code signing runs after all build phases, so
    # editing the plist here is still inside the signature.
    #
    # The key lands only in the built app's Info.plist (and DerivedData) — never
    # in project.yml, never in the .xcodeproj. Extractable with `strings`, same
    # accepted trade-off as the iOS IPA (see .claude/CLAUDE.md gotchas).
    postBuildScripts:
      - name: Inject API keys from server/.env
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail

          PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          ENV_FILE="${SRCROOT}/../server/.env"

          # What each key powers, so a warning below names the feature that will
          # be dead rather than just the variable that is missing.
          feature_for() {
            case "$1" in
              ANTHROPIC_API_KEY) echo "Chat will report 'API key not configured'" ;;
              OPENAI_API_KEY)    echo "trip tiles will draw the glyph instead of an illustration" ;;
              *)                 echo "the feature that reads it will be unconfigured" ;;
            esac
          }

          # Each key is independent: a missing OpenAI key must not stop the
          # Anthropic one being written, so this loop `continue`s per key rather
          # than exiting the script the way the single-key version did.
          for name in ANTHROPIC_API_KEY OPENAI_API_KEY; do
            # An explicit `xcodebuild <NAME>=…` already filled this in. Don't
            # clobber it. `$(…)` means the build setting was undefined.
            existing="$(/usr/libexec/PlistBuddy -c "Print :$name" "$PLIST" 2>/dev/null || true)"
            case "$existing" in
              ""|'$('*|'${'*) ;;
              *) echo "note: $name supplied by build setting; leaving as is"; continue ;;
            esac

            if [ ! -f "$ENV_FILE" ]; then
              echo "warning: $ENV_FILE not found — $(feature_for "$name")"
              continue
            fi

            # Tolerates `KEY=v`, `KEY="v"`, `KEY='v'` and trailing whitespace.
            key="$(sed -n "s/^$name=//p" "$ENV_FILE" | head -n1 \
                   | tr -d '\r' | sed -e 's/^["'"'"']//' -e 's/["'"'"']$//' \
                   | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

            if [ -z "$key" ]; then
              echo "warning: $name empty in $ENV_FILE — $(feature_for "$name")"
              continue
            fi

            # Never echo $key. Set-then-Add covers both "placeholder present" and
            # "property absent"; PlistBuddy has no upsert.
            /usr/libexec/PlistBuddy -c "Set :$name $key" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Add :$name string $key" "$PLIST"
            echo "note: injected $name from server/.env"
          done

  PersonalDashboardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: PersonalDashboardUITests
    dependencies:
      - target: PersonalDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshaysharma.personaldashboard.uitests
        TEST_TARGET_NAME: PersonalDashboard
        DEVELOPMENT_TEAM: "PJFPUSSNUW"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  # Logic-level unit tests, hosted in the app so `@testable import
  # PersonalDashboard` can reach the importer + dedup internals. Wired for the
  # `test` action only (not `all`), so `ship-lan.sh`'s archive of the app target
  # never builds it. Depending on the app target makes xcodegen set TEST_HOST /
  # BUNDLE_LOADER automatically.
  PersonalDashboardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PersonalDashboardTests
    dependencies:
      - target: PersonalDashboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshaysharma.personaldashboard.tests
        DEVELOPMENT_TEAM: "PJFPUSSNUW"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  # macOS-hosted logic tests (#446). A second unit-test target rather than more
  # files in `PersonalDashboardTests`, for one reason that is not negotiable:
  # the vision board's pointer layer is an `NSView`, `VisionInteraction` is
  # macOS-only, and neither exists in the iOS module at all. `#if os(macOS)`
  # guards would compile the file to nothing on the simulator, which is a suite
  # that reports green while asserting nothing.
  #
  # Everything portable stays on the iOS side. `VisionBoardLayoutTests` and
  # `VisionHitTestTests` both run there, because the solver and the resolver are
  # pure and carry no AppKit — only the event plumbing needs the Mac.
  #
  # Hosted in DexterMac (`dependencies: target`, which makes xcodegen set
  # TEST_HOST / BUNDLE_LOADER) so `@testable import DexterMac` can reach it.
  # Wired into the DexterMac scheme's `test` action only, so a plain build of
  # the app never builds it.
  DexterMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DexterMacTests
    dependencies:
      - target: DexterMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.akshaysharma.personaldashboard.mac.tests
        DEVELOPMENT_TEAM: "PJFPUSSNUW"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  PersonalDashboard:
    build:
      targets:
        PersonalDashboard: all
        PersonalDashboardUITests: [test]
        PersonalDashboardTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - PersonalDashboardTests
        - PersonalDashboardUITests
  DexterMac:
    build:
      targets:
        DexterMac: all
        DexterMacTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - DexterMacTests
    run:
      config: Debug
      # OPTIONAL override for the on-device AI key (#343). The normal path is
      # the target's post-build script, which reads server/.env at BUILD time
      # and needs no shell setup at all.
      #
      # This env var is expanded by xcodegen FROM THE SHELL at `xcodegen
      # generate` time, so it only carries a real key if you exported one:
      #   export ANTHROPIC_API_KEY=sk-ant-…
      #   xcodegen generate
      # Otherwise the scheme holds the literal `${ANTHROPIC_API_KEY}`, which
      # AppConfig.resolved rejects — harmless now, because the Info.plist
      # written by the post-build script is the next source it tries.
      # Kept for the case where you want to run against a DIFFERENT key from
      # the one in server/.env without editing that file.
      environmentVariables:
        - variable: ANTHROPIC_API_KEY
          value: ${ANTHROPIC_API_KEY}
          isEnabled: true
